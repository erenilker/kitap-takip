{% extends "base.html" %}
{% block title %}İstatistik - Kitap Takip{% endblock %}
{% block content %}
<h1 class="page-heading">İstatistik</h1>
<div class="stats-grid">
    <div class="stat-card">
        <span>Yıllık hedef</span>
        <strong>{{ goal_status }}</strong>
    </div>
    <div class="stat-card">
        <span>Okuma serisi</span>
        <strong>{{ reading_streak }} gün</strong>
    </div>
</div>
<div class="chart-card">
    <canvas id="monthlyChart"></canvas>
</div>
{% endblock %}
{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
new Chart(document.getElementById("monthlyChart"), {
    type: "bar",
    data: {
        labels: {{ month_labels | tojson }},
        datasets: [{
            label: "Okunan sayfa",
            data: {{ monthly | tojson }},
            backgroundColor: "#EC691F",
            borderRadius: 6
        }]
    },
    options: {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true } }
    }
});
</script>
{% endblock %}
