{% extends "base.html" %}
{% block title %}Giriş - Kitap Takip{% endblock %}
{% block content %}
<div class="login-card card">
    <div class="card-body">
        <h1 class="h3 text-center mb-4">📚 Kitap Takip</h1>
        <form method="post">
            <div class="mb-3">
                <label class="form-label" for="username">Kullanıcı adı</label>
                <input id="username" name="username" class="form-control" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label class="form-label" for="password">Şifre</label>
                <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary w-100" type="submit">Giriş</button>
        </form>
    </div>
</div>
{% endblock %}
